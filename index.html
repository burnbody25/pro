  <style>
    :root {
      --bg-main: #121212;
      --bg-surface: #181818;
      --bg-card: #1E1E1E;
      --bg-card-hover: #262626;
      --border-color: rgba(255, 255, 255, 0.08);

      --cyan-glow: rgba(0, 229, 255, 0.25);
      --orange: #FF9100;

      --red: #FF5252;
      --purple: #B388FF;

      --text-white: #FFFFFF;
      --text-gray: #A0A0A0;
      --font-stack: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      font-family: var(--font-stack);

    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    .brand-title-wrap h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.5px; }
    .brand-title-wrap h1 span { color: var(--lime); }
    .brand-title-wrap p { font-size: 0.68rem; color: var(--cyan); font-weight: 600; letter-spacing: 0.3px; }

    .header-actions { display: flex; gap: 8px; }

    .symptom-card::before {

    .symptom-card[data-cat="상체"]::before { background: var(--cyan); }

    .symptom-card[data-cat="골반및고관절"]::before { background: var(--purple); }
    .symptom-card[data-cat="하지및발"]::before { background: var(--orange); }

    .symptom-card:hover {

    /* Webp Asset Image Container */

    .modal-footer {

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-gray); margin-bottom: 6px; }

    .form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--lime); }

      background: #222; border: 1px solid #333; color: #aaa; padding: 8px 0; border-radius: 6px;

    .vas-btn.low.selected { background: #00E5FF; }
    .vas-btn.mid.selected { background: #CCFF00; }
